name: demo-screenshots

on:
  push:
    paths:
      - ".github/workflows/demo-screenshots.yml"
      - "scripts/capture-demo.mjs"
      - "server/**"
      - "src/**"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.6.0
      - run: npm install
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install chromium
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Start demo
        run: |
          LLM_MODE=mock npm run dev > /tmp/a2ui-demo.log 2>&1 &
          echo $! > /tmp/a2ui-demo.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/a2ui-demo.log
          exit 1
      - name: Capture screenshots
        run: node scripts/capture-demo.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: a2ui-demo-screenshots
          path: artifacts/demo-screenshots/*.png
          if-no-files-found: error
